<main><h1>#879 界面预览</h1><p class="m">commit 69d2dd7 · <a href="https://github.com/yetone/magpie/pull/879">回到 PR</a> · 供应商页新增「本地配置发现」提示：扫描 Alma / CC Switch / Claude Code / Codex 的可导入配置，无供应商时显示带数量与来源应用的醒目提示，已有供应商时在「＋ 添加供应商」旁显示紧凑的「导入本地配置（n）…」链接；点「忽略」把配置指纹写进 localStorage 并在重开窗口后继续隐藏。自动发现只取应用名与指纹，并让既有的导入清单默认只勾选被发现的配置。</p>
