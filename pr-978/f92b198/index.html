<main><h1>#978 界面预览</h1><p class="m">commit f92b198 · <a href="https://github.com/yetone/magpie/pull/978">回到 PR</a> · 本 PR 让原生用量窗口在窄宽度下头部不再把「立即重新读取」和合计拆到不同行、会话 chip 与六个 KPI 小字不再被裁切、图表日期不再挤在一起，并修好周期高亮：重绘时从当前可见位置续接、换行时只盖住选中那一行、resize 或从别的页返回后重新对齐。托盘（面板）的周期按钮在响应重绘时保持不换，按下期间的点击不再丢失。</p>
